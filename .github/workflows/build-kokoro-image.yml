name: build-kokoro-image
# Builds the Kokoro/Chloé StyleTTS2 training image and pushes it to GHCR.
# This is the realistic build path on a machine WITHOUT a local Docker daemon:
# GitHub Actions provides the daemon; the built-in GITHUB_TOKEN authenticates
# the GHCR push (no PAT needed inside CI). Public repo → free CI minutes.
#
# To use: push this directory to a GitHub repo named `kokoro-train` under the
# account ivangegovdve-sudo, then either it runs on push or trigger manually
# from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # allows GITHUB_TOKEN to push to ghcr.io/<owner>/*

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/kokoro-train:latest
          provenance: false

      - name: Make package public (so Akash providers can pull anonymously)
        run: |
          echo "After first push, set the GHCR package 'kokoro-train' visibility"
          echo "to PUBLIC in GitHub → Packages → kokoro-train → Package settings."
          echo "Public image = no pull credentials needed in the Akash template."
